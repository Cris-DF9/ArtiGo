<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faberio · Statistiche</title><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><meta name="theme-color" content="#087a46">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#087a46;--dg:#14251c;--m:#eaf6ef;--bg:#eef3f0;--l:#dce7e0;--mu:#6d7872}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17231c}.app{max-width:1080px;margin:auto;min-height:100vh;background:#fff}.top{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}.logo{font-size:28px;font-weight:900;color:var(--g)}.top a{color:var(--g);text-decoration:none;font-weight:800}.content{padding:24px}.head{display:flex;gap:14px;align-items:end;justify-content:space-between;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{border:1px solid var(--l);background:#fff;border-radius:20px;padding:9px 13px;cursor:pointer}.filters button.on{background:var(--g);color:#fff;border-color:var(--g)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric,.panel{border:1px solid var(--l);border-radius:16px;padding:16px}.metric b{font-size:30px;display:block}.metric small,.muted{color:var(--mu)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel h2{margin:0 0 16px}.barrow{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:10px 0;font-size:13px}.track{height:12px;background:#edf2ef;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--g);border-radius:20px}.funnel{display:grid;gap:8px}.fstep{background:var(--m);border-radius:12px;padding:12px}.fstep b{float:right}.trend{display:flex;align-items:end;gap:5px;height:180px;padding-top:20px;border-bottom:1px solid var(--l)}.col{flex:1;min-width:8px;background:var(--g);border-radius:5px 5px 0 0;position:relative}.col:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--dg);color:#fff;padding:5px;border-radius:6px;white-space:nowrap;font-size:10px}.money b{font-size:27px}.err{color:#a33}.empty{padding:25px;text-align:center;color:var(--mu)}@media(max-width:720px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.content{padding:16px}.barrow{grid-template-columns:90px 1fr 35px}}</style>
<style>.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}.logo img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 4px 12px rgba(23,35,28,.10)}.logo span{line-height:1}</style>
</head>
<body><div class="app">
<header class="top">

<a class="logo" href="/" aria-label="Faberio"><img src="/assets/faberio-mark.png" alt=""><span>Faberio</span></a>
<a href="/">← Operatività</a>
</header>
<main class="content"><div class="head"><div><small>ADMIN · REPORT</small><h1>Statistiche Faberio</h1><div class="muted">Dati reali della piattaforma</div></div><div class="filters"><button data-days="7">7 giorni</button><button class="on" data-days="30">30 giorni</button><button data-days="90">90 giorni</button><button data-days="365">Anno</button></div></div><div id="out"><div class="empty">Caricamento statistiche…</div></div></main></div><script>const db=supabase.createClient('https://vysvbfwwcckrnnphtprq.supabase.co','sb_publishable_NMhJX4hqkHbVHYEFnO6I4w_783xTDZY');let days=30;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n||0));const titleCase=s=>String(s||'').trim().toLocaleLowerCase('it-IT').replace(/(^|\s|[-'])\p{L}/gu,m=>m.toLocaleUpperCase('it-IT'));const norm=s=>String(s||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('it-IT');document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-days]').forEach(x=>x.classList.remove('on'));b.classList.add('on');days=+b.dataset.days;load()});function pct(a,b){return b?Math.round(a/b*100):0}function bars(obj){let es=Object.entries(obj).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...es.map(x=>x[1]));return es.length?es.map(([k,v])=>'<div class="barrow"><span>'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+v/mx*100+'%"></div></div><b>'+v+'</b></div>').join(''):'<div class="empty">Nessun dato nel periodo</div>'}async function load(){const out=document.getElementById('out');out.innerHTML='<div class="empty">Aggiornamento…</div>';const s=await db.auth.getSession(),u=s.data.session?.user;if(!u)return location.href='/';const p=await db.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin')return location.href='/';const since=new Date(Date.now()-days*86400000).toISOString();const [rq,of,pr,lg]=await Promise.all([db.from('job_requests').select('*').gte('created_at',since),db.from('offers').select('*').gte('created_at',since),db.from('profiles').select('*').gte('created_at',since),db.from('activity_log').select('*').gte('created_at',since)]);const er=rq.error||of.error||pr.error||lg.error;if(er){out.innerHTML='<p class="err">'+esc(er.message)+'</p>';return}const R=rq.data||[],O=of.data||[],P=pr.data||[],L=lg.data||[],acceptedOffers=O.filter(x=>x.status==='accepted'),accepted=acceptedOffers.length,closed=R.filter(x=>['accepted','completed','closed'].includes(x.status)).length,cats={},zones={},states={};R.forEach(x=>{cats[x.category]=(cats[x.category]||0)+1;const zk=norm(x.municipality),zl=titleCase(x.municipality);if(zk)zones[zk]=(zones[zk]||{label:zl,count:0});if(zk)zones[zk].count++;states[x.status]=(states[x.status]||0)+1});const zoneBars={};Object.values(zones).forEach(z=>zoneBars[z.label]=z.count);const totalOffers=O.reduce((a,x)=>a+Number(x.amount||0),0),acceptedValue=acceptedOffers.reduce((a,x)=>a+Number(x.amount||0),0),avgOffer=O.length?totalOffers/O.length:0,avgAccepted=acceptedOffers.length?acceptedValue/acceptedOffers.length:0;const buckets=Math.min(days,30),counts=Array(buckets).fill(0);R.forEach(x=>{let d=Math.floor((Date.now()-new Date(x.created_at))/86400000);if(d<buckets)counts[buckets-1-d]++});const mx=Math.max(1,...counts);const trend=counts.map(v=>'<div class="col" style="height:'+(v?Math.max(8,v/mx*100):2)+'%" data-tip="'+v+' richieste"></div>').join('');out.innerHTML='<div class="grid4"><div class="metric"><b>'+R.length+'</b><small>Richieste</small></div><div class="metric"><b>'+O.length+'</b><small>Offerte</small></div><div class="metric"><b>'+closed+'</b><small>Interventi acquisiti</small></div><div class="metric"><b>'+P.length+'</b><small>Nuovi utenti</small></div></div><div class="grid4 money"><div class="metric"><b>'+euro(totalOffers)+'</b><small>Valore totale offerte</small></div><div class="metric"><b>'+euro(acceptedValue)+'</b><small>Valore acquisito</small></div><div class="metric"><b>'+euro(avgOffer)+'</b><small>Offerta media</small></div><div class="metric"><b>'+euro(avgAccepted)+'</b><small>Ticket medio acquisito</small></div></div><div class="grid2"><section class="panel"><h2>Andamento richieste</h2><div class="trend">'+trend+'</div><p class="muted">Ultimi '+Math.min(days,30)+' giorni · passa sui grafici per il dettaglio</p></section><section class="panel"><h2>Funnel di conversione</h2><div class="funnel"><div class="fstep">Richieste <b>'+R.length+'</b></div><div class="fstep">Con almeno un’offerta <b>'+new Set(O.map(x=>x.request_id)).size+'</b></div><div class="fstep">Offerte accettate <b>'+accepted+'</b></div><div class="fstep">Conversione <b>'+pct(accepted,R.length)+'%</b></div></div></section><section class="panel"><h2>Categorie più richieste</h2>'+bars(cats)+'</section><section class="panel"><h2>Richieste per Comune</h2>'+bars(zoneBars)+'</section><section class="panel"><h2>Stato richieste</h2>'+bars(states)+'</section><section class="panel"><h2>Attività registrate</h2><div class="metric"><b>'+L.length+'</b><small>eventi nel periodo</small></div><p class="muted">Registrazioni, cambi ruolo/stato, richieste e offerte alimentano progressivamente questo storico.</p></section></div>'}load();</script></body></html>
