<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#eef3f0;font-family:Arial,sans-serif;color:#17231c;display:grid;place-items:center;min-height:100vh}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #dce7e0;border-radius:18px;padding:28px;text-align:center}.logo{font-size:30px;font-weight:900;color:#087a46;margin-bottom:20px}.ok{color:#087a46}.err{color:#a33}.muted{color:#69756e;font-size:14px}</style>

<body><div class="card">
<div class="logo"><img src="/assets/faberio-mark.png" alt=""><span>Faberio</span></div>
<h2 id="title">Conferma email in corso…</h2><p id="msg" class="muted">Attendi qualche secondo.</p></div><script>const sb=window.supabase.createClient('https://vysvbfwwcckrnnphtprq.supabase.co','sb_publishable_NMhJX4hqkHbVHYEFnO6I4w_783xTDZY');const title=document.getElementById('title'),msg=document.getElementById('msg');function success(){title.textContent='Email confermata ✓';title.className='ok';msg.textContent='Accesso completato. Ti porto su Faberio…';history.replaceState({},'',location.pathname);setTimeout(()=>location.replace('https://faberio.it/'),1200)}function fail(t){title.textContent='Conferma non riuscita';title.className='err';msg.textContent=t||'Il link potrebbe essere scaduto. Torna su Faberio e riprova.'}async function run(){try{const p=new URLSearchParams(location.search);const token_hash=p.get('token_hash');if(token_hash){const type=p.get('type')||'email';const r=await sb.auth.verifyOtp({token_hash,type});if(r.error)throw r.error;return success()}await new Promise(r=>setTimeout(r,250));const s=await sb.auth.getSession();if(s.error)throw s.error;if(s.data.session)return success();const hash=new URLSearchParams(location.hash.replace(/^#/,''));if(hash.get('error_description'))return fail(decodeURIComponent(hash.get('error_description')));fail('Sessione di conferma non trovata.')}catch(e){console.error(e);fail(e.message)}}run();</script></body></html>
