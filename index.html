<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArtiGo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#087a46;--m:#eaf6ef;--bg:#eef3f0;--t:#17231c;--mu:#69756e;--l:#dce7e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--t)}.app{max-width:520px;min-height:100vh;margin:auto;background:white}.top{padding:18px;display:flex;justify-content:space-between;border-bottom:1px solid var(--l)}.logo{font-size:28px;font-weight:900;color:var(--g)}.pill,.status{background:var(--m);color:var(--g);padding:8px 10px;border-radius:20px;font-size:12px}.content{padding:20px 18px 90px}.hero{padding:28px 18px;background:var(--g);color:white}.card{border:1px solid var(--l);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,.cat{border:0;border-radius:13px;padding:14px;font-weight:800;cursor:pointer}.btn{width:100%;margin-top:9px}.cat{background:white;border:1px solid var(--l)}.primary{background:var(--g);color:white}.secondary{background:var(--m);color:var(--g)}input,textarea,select{width:100%;padding:12px;border:1px solid var(--l);border-radius:11px;margin:5px 0 10px}textarea{min-height:90px}.muted{font-size:12px;color:var(--mu)}.err{color:#a33;font-size:12px}.ok{color:var(--g);font-size:12px}.hide{display:none}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:white;border-top:1px solid var(--l);padding:8px}.nav button{flex:1;border:0;background:none;padding:8px;font-size:11px}.admin{background:#17231c;color:white}.admin .muted{color:#c7d0ca}.metric{font-size:25px;font-weight:900}h1,h2,h3{margin:8px 0 12px}</style></head><body><div class="app"><header class="top"><div class="logo">ArtiGo</div><span id="pill" class="pill">...</span></header><main id="auth" class="content"><h1>Benvenuto in ArtiGo</h1><div class="card"><h2>Accedi</h2><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Accedi</button></div><div class="card"><h2>Crea account</h2><input id="rn" placeholder="Nome e cognome"><input id="re" type="email" placeholder="Email"><input id="rp" type="password" placeholder="Password"><button class="btn secondary" onclick="signup()">Registrati</button></div><div id="authmsg"></div></main><main id="home" class="hide"><div class="hero"><small>CLIENTE</small><h1>Di cosa hai bisogno?</h1><p>Descrivi il lavoro. ArtiGo organizza il resto.</p></div><div class="content"><div class="grid"><button class="cat" onclick="newReq('Elettricista')">⚡ Elettricista</button><button class="cat" onclick="newReq('Idraulico')">💧 Idraulico</button><button class="cat" onclick="newReq('Fabbro')">🔑 Fabbro</button><button class="cat" onclick="newReq('Falegname')">🪚 Falegname</button><button class="cat" onclick="newReq('Cartongessista')">▣ Cartongesso</button><button class="cat" onclick="newReq('Giardiniere')">🌿 Giardiniere</button><button class="cat" onclick="newReq('Edilizia')">🧱 Edilizia</button></div><button class="btn primary" onclick="show('request')">+ Crea una richiesta</button><h2>Le mie richieste</h2><div id="requests"></div></div></main><main id="request" class="content hide"><h1>Nuova richiesta</h1><select id="cat"><option>Elettricista</option><option>Idraulico</option><option>Fabbro</option><option>Falegname</option><option>Cartongessista</option><option>Giardiniere</option><option>Edilizia</option></select><textarea id="desc" placeholder="Descrizione"></textarea><input id="mun" placeholder="Comune"><input id="cap" placeholder="CAP"><label><input id="urg" type="checkbox" style="width:auto"> Urgente</label><button class="btn primary" onclick="saveRequest()">Invia richiesta</button><div id="reqmsg"></div></main><main id="pro" class="content hide"><h1>Area Professionista</h1><div id="probox"></div></main><main id="admin" class="content admin hide"><h1>Dashboard ArtiGo</h1><div id="adminbox"></div></main><main id="account" class="content hide"><h1>Account</h1><div id="profilebox"></div><button class="btn secondary" onclick="logout()">Esci</button></main><nav id="nav" class="nav hide"><button onclick="show('home')">⌂<br>Home</button><button onclick="show('request')">＋<br>Richiesta</button><button onclick="show('pro')">⚒<br>Pro</button><button id="adminnav" class="hide" onclick="show('admin')">▦<br>Admin</button><button onclick="show('account')">●<br>Account</button></nav></div><script>const URL='https://vysvbfwwcckrnnphtprq.supabase.co',KEY='sb_publishable_NMhJX4hqkHbVHYEFnO6I4w_783xTDZY',SITE='https://artigo-iota.vercel.app';const sb=supabase.createClient(URL,KEY);let user=null,profile=null;const e=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(id){['auth','home','request','pro','admin','account'].forEach(x=>e(x).classList.add('hide'));e(id).classList.remove('hide');if(id==='home')loadRequests();if(id==='pro')loadPro();if(id==='admin')loadAdmin();if(id==='account')loadAccount()}async function init(){let{data}=await sb.auth.getSession();user=data.session?.user||null;if(!user){e('nav').classList.add('hide');e('pill').textContent='Accedi';show('auth');return}let r=await sb.from('profiles').select('*').eq('id',user.id).single();profile=r.data;e('pill').textContent=profile?.full_name||user.email;e('nav').classList.remove('hide');e('adminnav').classList.toggle('hide',profile?.role!=='admin');show(profile?.role==='admin'?'admin':'home')}async function login(){let{error}=await sb.auth.signInWithPassword({email:e('le').value.trim(),password:e('lp').value});e('authmsg').innerHTML=error?'<p class="err">'+esc(error.message)+'</p>':'';if(!error)init()}async function signup(){let{error}=await sb.auth.signUp({email:e('re').value.trim(),password:e('rp').value,options:{data:{full_name:e('rn').value.trim()},emailRedirectTo:SITE}});e('authmsg').innerHTML=error?'<p class="err">'+esc(error.message)+'</p>':'<p class="ok">Registrazione eseguita. Controlla la mail di conferma.</p>'}async function logout(){await sb.auth.signOut();location.reload()}function newReq(c){e('cat').value=c;show('request')}async function saveRequest(){let row={client_id:user.id,category:e('cat').value,description:e('desc').value.trim(),municipality:e('mun').value.trim(),postal_code:e('cap').value.trim()||null,urgent:e('urg').checked};if(!row.description||!row.municipality)return e('reqmsg').innerHTML='<p class="err">Inserisci descrizione e Comune.</p>';let{error}=await sb.from('job_requests').insert(row);if(error)return e('reqmsg').innerHTML='<p class="err">'+esc(error.message)+'</p>';e('reqmsg').innerHTML='<p class="ok">✓ Richiesta inviata</p>';setTimeout(()=>show('home'),600)}async function loadRequests(){let{data,error}=await sb.from('job_requests').select('*,offers(*)').eq('client_id',user.id).order('created_at',{ascending:false});if(error)return e('requests').innerHTML='<p class="err">'+esc(error.message)+'</p>';e('requests').innerHTML=(data||[]).map(r=>'<div class="card"><div class="row"><strong>'+esc(r.category)+' · '+esc(r.municipality)+'</strong><span class="pill">'+esc(r.status)+'</span></div><p>'+esc(r.description)+'</p><p class="muted">Inviata '+new Date(r.created_at).toLocaleString('it-IT')+'</p>'+((r.offers||[]).map(o=>'<div class="card"><b>Offerta € '+Number(o.amount||0).toFixed(2)+'</b><p class="muted">Prima disponibilità: '+new Date(o.first_availability).toLocaleString('it-IT')+'</p>'+(o.notes?'<p>'+esc(o.notes)+'</p>':'')+(o.status==='pending'?'<button class="btn primary" onclick="acceptOffer(\''+o.id+'\')">Accetta offerta</button>':'<div class="status">'+esc(o.status)+'</div>')+'</div>').join(''))+'</div>').join('')||'<div class="card muted">Nessuna richiesta.</div>'}async function acceptOffer(id){let{error}=await sb.rpc('accept_offer',{p_offer_id:id});if(error)alert(error.message);else loadRequests()}async function loadPro(){if(profile?.pro_status==='approved'){let{data,error}=await sb.from('job_requests').select('*').in('status',['open','offers_received']).order('created_at',{ascending:false});if(error)return e('probox').innerHTML='<p class="err">'+esc(error.message)+'</p>';e('probox').innerHTML='<div class="status">✓ Professionista verificato</div>'+((data||[]).map(r=>'<div class="card"><div class="row"><b>'+esc(r.category)+' · '+esc(r.municipality)+'</b>'+(r.urgent?'<span class="err">URGENTE</span>':'')+'</div><p>'+esc(r.description)+'</p><p class="muted">'+new Date(r.created_at).toLocaleString('it-IT')+'</p><input id="amt_'+r.id+'" type="number" step="0.01" placeholder="Importo €"><input id="av_'+r.id+'" type="datetime-local"><textarea id="no_'+r.id+'" placeholder="Note offerta"></textarea><button class="btn primary" onclick="sendOffer(\''+r.id+'\')">Invia offerta</button></div>').join('')||'<div class="card">Nessuna richiesta disponibile.</div>');return}if(profile?.pro_status==='pending')return e('probox').innerHTML='<div class="status">Richiesta Professionista in verifica</div>';e('probox').innerHTML='<div class="card"><h2>Diventa Professionista</h2><p class="muted">Invia la richiesta di abilitazione. L’admin potrà approvarla dalla dashboard.</p><button class="btn primary" onclick="requestPro()">Richiedi abilitazione</button></div>'}async function requestPro(){let a=await sb.from('profiles').update({pro_status:'pending'}).eq('id',user.id);if(a.error)return alert(a.error.message);await sb.from('pro_profiles').upsert({user_id:user.id});profile.pro_status='pending';loadPro()}async function sendOffer(rid){let amount=parseFloat(e('amt_'+rid).value),av=e('av_'+rid).value;if(!amount||!av)return alert('Inserisci importo e prima disponibilità');let{error}=await sb.from('offers').insert({request_id:rid,pro_id:user.id,type:'offerta',amount,first_availability:new Date(av).toISOString(),notes:e('no_'+rid).value.trim()||null});if(error)return alert(error.message);await sb.from('job_requests').update({status:'offers_received'}).eq('id',rid);alert('Offerta inviata');loadPro()}async function loadAdmin(){if(profile?.role!=='admin')return show('home');let [rq,of,pp,ac]=await Promise.all([sb.from('job_requests').select('*').order('created_at',{ascending:false}),sb.from('offers').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*').eq('pro_status','pending'),sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(30)]);let requests=rq.data||[],offers=of.data||[],pending=pp.data||[],logs=ac.data||[];e('adminbox').innerHTML='<div class="grid"><div class="card"><div class="metric">'+requests.length+'</div><div class="muted">Richieste</div></div><div class="card"><div class="metric">'+offers.length+'</div><div class="muted">Offerte</div></div></div><h2>Professionisti da verificare</h2>'+(pending.map(p=>'<div class="card"><b>'+esc(p.full_name||p.id)+'</b><button class="btn primary" onclick="approvePro(\''+p.id+'\')">Approva Professionista</button></div>').join('')||'<div class="card muted">Nessuna verifica in attesa.</div>')+'<h2>Richieste recenti</h2>'+requests.slice(0,15).map(r=>'<div class="card"><div class="row"><b>'+esc(r.category)+' · '+esc(r.municipality)+'</b><span class="status">'+esc(r.status)+'</span></div><p>'+esc(r.description)+'</p><p class="muted">'+new Date(r.created_at).toLocaleString('it-IT')+'</p></div>').join('')+'<h2>Registro attività</h2>'+logs.map(l=>'<div class="card"><b>'+esc(l.event_type)+'</b><p class="muted">'+new Date(l.created_at).toLocaleString('it-IT')+'</p></div>').join('')}async function approvePro(id){let{error}=await sb.from('profiles').update({pro_status:'approved',role:'pro'}).eq('id',id);if(error)alert(error.message);else loadAdmin()}async function loadAccount(){e('profilebox').innerHTML='<div class="card"><b>'+esc(profile?.full_name||'Utente')+'</b><p>'+esc(user.email)+'</p><div class="status">Ruolo: '+esc(profile?.role)+' · Pro: '+esc(profile?.pro_status)+'</div></div>'}sb.auth.onAuthStateChange(()=>setTimeout(init,0));init();</script></body></html>
